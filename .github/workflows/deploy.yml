name: CI - Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v3

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📥 Install Dependencies
        run: npm install
        working-directory: analytics-dashboard-assessment

      - name: 🏗️ Build Project
        run: npm run build
        working-directory: analytics-dashboard-assessment

      - name: ✅ Run Tests
        run: npm test -- --watchAll=false
        working-directory: analytics-dashboard-assessment
